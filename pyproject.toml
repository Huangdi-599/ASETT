[project]
name = "asset-backend"
version = "0.1.0"
description = "Modern Django backend for crypto portfolio management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "django-ninja>=1.3,<2.0",
  "djangorestframework-simplejwt>=5.3,<6.0",
  "django-cors-headers>=4.4,<5.0",
  "django-environ>=0.11,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "celery>=5.4,<6.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<1.0",
  "whitenoise>=6.8,<7.0",
]

[dependency-groups]
dev = [
  "factory-boy>=3.3,<4.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-django>=4.9,<5.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
